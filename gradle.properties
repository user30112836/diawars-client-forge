org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

## Environment Properties

# Must match the Fabric mod's Minecraft version so both clients can play together.
minecraft_version=26.2
# Version range for mods.toml (current major up to next major, exclusive).
minecraft_version_range=[26.2,26.3)
# Forge version for Minecraft 26.2 (see https://files.minecraftforge.net).
forge_version=65.1.0
forge_version_range=[65,)
loader_version_range=[65,)
# Mappings: official Mojang names (26.1+ is unobfuscated upstream).
mapping_channel=official
mapping_version=26.2

